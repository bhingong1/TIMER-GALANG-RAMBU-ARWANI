<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live Timer Firebase</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="flex flex-col items-center justify-center min-h-screen bg-gray-900 text-white">
  <h1 class="text-3xl font-bold mb-6">Live Timer</h1>
  <div id="timer" class="text-6xl font-mono mb-6">--:--</div>
  <button id="resetBtn" class="bg-blue-600 px-4 py-2 rounded-lg hover:bg-blue-500">Reset Timer</button>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "ISI_APIKEY_KAMU",
      authDomain: "live-timer-819ec.firebaseapp.com",
      databaseURL: "https://live-timer-819ec-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "live-timer-819ec",
      storageBucket: "live-timer-819ec.appspot.com",
      messagingSenderId: "XXXXXX",
      appId: "XXXXXX"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const timerRef = ref(db, "shardertimer");

    let countdownInterval;

    onValue(timerRef, (snapshot) => {
      const data = snapshot.val();
      if (!data) return;

      const endTime = data.endTime;
      const now = Date.now();
      let remaining = Math.max(0, Math.floor((endTime - now) / 1000));

      clearInterval(countdownInterval);
      startCountdown(remaining);
    });

    function startCountdown(seconds) {
      clearInterval(countdownInterval);
      let timeLeft = seconds;

      updateTimerDisplay(timeLeft);

      countdownInterval = setInterval(() => {
        timeLeft--;
        if (timeLeft <= 0) {
          clearInterval(countdownInterval);
          updateTimerDisplay(0);
          return;
        }
        updateTimerDisplay(timeLeft);
      }, 1000);
    }

    function updateTimerDisplay(seconds) {
      const m = Math.floor(seconds / 60);
      const s = seconds % 60;
      document.getElementById("timer").textContent = `${m}:${s.toString().padStart(2, '0')}`;
    }

    // Tombol Reset
    document.getElementById("resetBtn").addEventListener("click", () => {
      const defaultTime = 900; // detik (15 menit)
      const newEndTime = Date.now() + defaultTime * 1000;
      set(timerRef, { defaultTime, endTime: newEndTime });
    });
  </script>
</body>
</html>
